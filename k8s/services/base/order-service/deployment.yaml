apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: order-service
  name: order-service
  namespace: micro-mart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  strategy: {}
  template:
    metadata:
      labels:
        app: order-service
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: order-service
          imagePullPolicy: Always # 항상 레지스트리에서 이미지를 새로 확인하고 가져옴
          name: order-service
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-database-secrets
            - secretRef:
                name: nats-secrets
            - secretRef:
                name: internal-service-token-secrets
          # 하나씩 가져오는 예제
          # env:
          #   - name: DATABASE_URL
          #     valueFrom:
          #       secretKeyRef:
          #         name: database-secrets
          #         key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              # memory만 최소한으로 제한 걸어놓고 k6으로 부하테스트 이후 정확한 제한 값 산출
              memory: "256Mi"
      volumes:
        - name: tmp
          emptyDir: {}

status: {}
