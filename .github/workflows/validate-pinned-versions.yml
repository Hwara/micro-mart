name: Validate pinned versions

on:
  pull_request:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  validate-pinned-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate constraints pins
        run: python scripts/validate_pinned_versions.py requirements/constraints.txt
